<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d"><title id="t">Food and supplements contribute to total intake</title><desc id="d">Two separate boxes representing food and supplement amount both feed into total intake. Reference values depend on stage and age; not a dose prescription. Source S086, S215.</desc><style>text{font:18px system-ui,sans-serif;fill:#172b3b}.heading{font-size:23px;font-weight:650}.small{font-size:15px}.muted{fill:#455e70}.line{stroke:#627c8a;stroke-width:2;fill:none}.outline{stroke:#496679;stroke-width:2;fill:none}</style><rect width="720" height="360" fill="#fff"/><text x="24" y="39" class="heading">Total intake is not the supplement dose</text><rect x="32" y="90" width="235" height="86" rx="12" fill="#e0ebee" stroke="#627c8a"/><text x="149" y="127" text-anchor="middle">Food and beverages</text><text x="149" y="151" text-anchor="middle" class="small">Amount varies</text><text x="360" y="143" text-anchor="middle" class="heading">+</text><rect x="453" y="90" width="235" height="86" rx="12" fill="#f1e7d8" stroke="#927e5e"/><text x="570" y="127" text-anchor="middle">Supplement amount</text><text x="570" y="151" text-anchor="middle" class="small">If appropriate</text><path d="M149 176V208H360V232 M570 176V208H360" class="line"/><rect x="230" y="232" width="260" height="52" rx="10" fill="#edf1f3" stroke="#627c8a"/><text x="360" y="264" text-anchor="middle">Total daily intake</text><text x="360" y="308" text-anchor="middle" class="small muted">Reference depends on age and pregnancy/lactation stage.</text><text x="24" y="343" class="small muted">Research draft · conceptual illustration, not diagnostic · clinician review required</text></svg>
