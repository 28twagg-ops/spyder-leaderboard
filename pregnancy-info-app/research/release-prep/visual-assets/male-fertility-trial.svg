<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d"><title id="t">Live birth in FAZST trial</title><desc id="d">Folic acid plus zinc: 404 of 1185, reported 34 percent. Placebo: 416 of 1185, reported 35 percent. Reported risk difference minus 0.9 percentage points, 95 percent CI minus 4.7 to plus 2.8. Source IA008.</desc><style>text{font:18px system-ui,sans-serif;fill:#172b3b}.heading{font-size:23px;font-weight:650}.small{font-size:15px}.muted{fill:#455e70}.line{stroke:#627c8a;stroke-width:2;fill:none}.outline{stroke:#496679;stroke-width:2;fill:none}</style><rect width="720" height="360" fill="#fff"/><text x="24" y="39" class="heading">Live birth: male folic acid + zinc trial</text><text x="24" y="67" class="small muted">Couples undergoing infertility treatment · 2,370 randomized</text><text x="24" y="120">Supplement</text><rect x="170" y="97" width="490" height="34" rx="4" fill="#edf1f3"/><rect x="170" y="97" width="167.0548523206751" height="34" rx="4" fill="#587c86"/><text x="345" y="121">34% (404/1,185)</text><text x="24" y="181">Placebo</text><rect x="170" y="158" width="490" height="34" rx="4" fill="#edf1f3"/><rect x="170" y="158" width="172.0168776371308" height="34" rx="4" fill="#587c86"/><text x="350" y="182">35% (416/1,185)</text><path d="M170 216H660" class="line"/><text x="170" y="239" class="small">0%</text><text x="660" y="239" text-anchor="end" class="small">100%</text><text x="24" y="278">Reported difference −0.9 percentage points</text><text x="24" y="302" class="small">95% CI −4.7 to +2.8; no significant live-birth benefit. Source IA008.</text><text x="24" y="343" class="small muted">Research draft · conceptual illustration, not diagnostic · clinician review required</text></svg>
