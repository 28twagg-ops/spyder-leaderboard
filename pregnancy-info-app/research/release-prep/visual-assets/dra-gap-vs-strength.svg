<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d"><title id="t">Gap and strength are different outcomes</title><desc id="d">Two separate panels show an unchanged schematic abdominal gap and improved strength as conceptually independent endpoints. Source S028, randomized trial of 70 women 6 to 12 months postpartum.</desc><style>text{font:18px system-ui,sans-serif;fill:#172b3b}.heading{font-size:23px;font-weight:650}.small{font-size:15px}.muted{fill:#455e70}.line{stroke:#627c8a;stroke-width:2;fill:none}.outline{stroke:#496679;stroke-width:2;fill:none}</style><rect width="720" height="360" fill="#fff"/><text x="24" y="39" class="heading">Gap width and strength measure different things</text><text x="80" y="76">Inter-rectus distance</text><text x="436" y="76">Muscle performance</text><rect x="82" y="98" width="70" height="150" rx="28" fill="#d3a5a1" stroke="#926a6a"/><rect x="182" y="98" width="70" height="150" rx="28" fill="#d3a5a1" stroke="#926a6a"/><path class="line" d="M152 165H182 M152 155V175 M182 155V175"/><text x="167" y="272" text-anchor="middle" class="small">Conceptual gap</text><path d="M400 248H660 M400 248V108" class="line"/><rect x="448" y="185" width="65" height="63" fill="#b1c2cc"/><rect x="550" y="125" width="65" height="123" fill="#587c86"/><text x="480" y="273" text-anchor="middle" class="small">Earlier</text><text x="583" y="273" text-anchor="middle" class="small">Later</text><text x="360" y="307" text-anchor="middle" class="small muted">Illustrative only; not actual values or a guaranteed recovery trajectory.</text><text x="24" y="343" class="small muted">Research draft · conceptual illustration, not diagnostic · clinician review required</text></svg>
