<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d"><title id="t">Surface comfort and deeper skin changes</title><desc id="d">Two separated layers illustrate that topical moisturizer can relieve dryness without proving prevention of stretch marks in deeper skin. S001, S216, RP003.</desc><style>text{font:18px system-ui,sans-serif;fill:#172b3b}.heading{font-size:23px;font-weight:650}.small{font-size:15px}.muted{fill:#455e70}.line{stroke:#627c8a;stroke-width:2;fill:none}.outline{stroke:#496679;stroke-width:2;fill:none}</style><rect width="720" height="360" fill="#fff"/><text x="24" y="39" class="heading">Surface comfort is not proven prevention</text><rect x="35" y="90" width="440" height="26" rx="12" fill="#d9e7e9" stroke="#627c8a"/><rect x="35" y="125" width="440" height="55" rx="8" fill="#f2d8bf" stroke="#b08466"/><rect x="35" y="184" width="440" height="118" rx="8" fill="#efd4cb" stroke="#b08466"/><path d="M55 210Q90 230 130 213T205 214T280 220 M55 255Q95 232 132 258T205 256T280 257 M325 195Q305 235 337 291 M348 195Q327 241 366 291" stroke="#9a5f5c" stroke-width="4" fill="none"/><path class="line" d="M475 103H510 M475 150H510 M475 242H510"/><text x="521" y="108">Moisture layer</text><text x="521" y="155">Surface skin</text><text x="521" y="229">Deeper skin</text><text x="521" y="250" class="small">Connective tissue</text><text x="35" y="72" class="small muted">Not to scale; simplified layers, no repair or penetration implied.</text><text x="24" y="343" class="small muted">Research draft · conceptual illustration, not diagnostic · clinician review required</text></svg>
